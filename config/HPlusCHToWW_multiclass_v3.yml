# Configuration for HPlusCHToWW multi-class classification
# Signal (higgs) vs individual backgrounds (tt, st, diboson, vjets)

processes:
- "default"

# Binning for reweighting (consistent with hww_MVA workflow)
bins_pt:
- 0
- 30
- 40
- 60
- 80
- 100
- 120
- 140
- 160
- 180
- 200
- 225
- 250
- 275
- 300
- 325
- 350
- 100000

bins_eta:
- 0
- 12
- 20
- 40
- 60
- 72
- 80
- 100
- 120
- 140
- 160
- 180
- 200
- 225
- 250
- 275
- 300
- 325
- 350
- 400
- 450
- 500
- 100000

# Keys for pt/eta binning
pt_key: "dilepton_pt"
eta_key: "dilepton_mass"

# Processor type
processor: "LZ4TTCCProcessor"

# Tree name (required but not used for parquet)
treename: "Events"

# Event-level features for MVA training
# Based on H+c BDT variables from analysis note (17 variables)
# NOTE: Variables commented out are not yet in current parquet files
# Run hww_MVA workflow to generate all variables
global_features:
# Kinematic variables
- "dilepton_pt"         # pT(ll) - momentum of dilepton system
- "lepton1_pt"          # pT(l1) - transverse momentum of leading lepton
- "lepton2_pt"          # pT(l2) - transverse momentum of subleading lepton
- "jet_multiplicity"    # number of jets in an event
- "cjet_multiplicity"   # number of c-jets (medium wp) in an event
# Transverse mass variables
- "mtl1"                # mT(l1) - transverse mass (leading lepton, MET)
- "mtl2"                # mT(l2) - transverse mass (subleading lepton, MET)
- "dilepton_mass"       # m(ll) - mass of dilepton system
# Delta R variables 
- "delta_R_ll_l1"       # deltaR(ll, l1) - separation between dilepton and leading lepton
- "delta_R_ll_l2"       # deltaR(ll, l2) - separation between dilepton and subleading lepton
# Delta phi variables 
- "delta_phi_l1_MET"    # deltaPhi(l1, MET) - separation of leading lepton and MET
- "delta_phi_l2_MET"    # deltaPhi(l2, MET) - separation of subleading lepton and MET
- "delta_phi_ll_MET"          # deltaPhi(ll, MET) - separation of ll system and MET
# Secondary vertices 
- "nSV"                 # Number of secondary vertices


cpf_candidates: []
npf_candidates: []
vtx_features: []

n_cpf_candidates: 0
n_npf_candidates: 0
n_vtx_candidates: 0

# Multi-class truth labels (one-hot encoded from process_group)
truths:
- "is_higgsbkg"
- "is_hplusc"
- "is_tt"
- "is_st"
- "is_diboson"
- "is_vjets"


reference_flavour: "is_hplusc"

# Reweighting mode: "histogram" (2D pT/eta ratio) or "class" (inverse-frequency)
reweighting_mode: "class"

data_precision: "float32"

